spring:
  application:
    name: claims-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USER:claims}
    password: ${DB_PASSWORD:claims}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: claims-service
      auto-offset-reset: earliest

app:
  kafka:
    topics:
      claim-events: claim-events
  outbox:
    batch-size: 100
    send-timeout-ms: 5000
    poller:
      enabled: true
      interval-ms: 500

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
